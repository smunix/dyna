[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-py"
version = "0.1.0"
description = "Lazy, on-demand resource loader for Dyna servers (Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dyna", "lazy", "cache", "websocket", "json"]
dependencies = [
    "dyna-py",
    "websockets>=12.0",
]

[project.scripts]
lazy-py-demo = "lazy_py.examples.demo:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
