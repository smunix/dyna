[workspace]
resolver = "2"
members = [
    "dyna-core",
    "dyna-cli",
    "dyna-server",
    "dyna-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dyna Contributors"]
license = "MIT"
repository = "https://github.com/smunix/dyna"
description = "A Pijul-inspired distributed CRUD application for collaborative JSON resource editing"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Hashing
sha2 = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Bytes
bytes = "1"

# Itertools
itertools = "0.13"

# HTTP
axum = "0.7"
reqwest = { version = "0.12", features = ["json"] }

# Object store (S3)
object_store = { version = "0.11", features = ["aws"] }

# Internal crates
dyna-core = { path = "dyna-core" }
