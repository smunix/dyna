<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lazy-elm-demo — Dyna Lazy Resource Loader</title>
    <style>
        /* ── Reset & Base ─────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --bg-card: #1a1d27;
            --bg-card-hover: #22263a;
            --border: #2a2e3e;
            --text: #e1e4ed;
            --text-muted: #8b90a0;
            --accent: #6c8aff;
            --accent-dim: #4a5fa0;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --radius: 8px;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── App Layout ───────────────────────────────────────────────── */
        .app { display: flex; flex-direction: column; min-height: 100vh; }

        .app-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }
        .app-header h1 { font-size: 1.25rem; font-weight: 700; }
        .app-header .subtitle { color: var(--text-muted); font-size: 0.875rem; }

        .main-content {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            overflow: hidden;
        }

        .left-panel {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .right-panel {
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Cards ────────────────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }
        .card h2 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 12px 0 8px;
        }

        /* ── Badges ───────────────────────────────────────────────────── */
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 100px;
            margin-left: auto;
        }
        .badge-disconnected { background: rgba(248,113,113,0.15); color: var(--error); }
        .badge-connecting   { background: rgba(251,191,36,0.15);  color: var(--warning); }
        .badge-connected    { background: rgba(74,222,128,0.15);  color: var(--success); }

        /* ── Forms ────────────────────────────────────────────────────── */
        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.875rem;
            font-family: var(--font-mono);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ── Buttons ──────────────────────────────────────────────────── */
        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: var(--accent-dim);
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            width: 100%;
            margin-top: 4px;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dim);
        }
        .btn-small { padding: 4px 10px; font-size: 0.75rem; }

        /* ── Resource List ────────────────────────────────────────────── */
        .count {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--accent);
        }
        .resource-list {
            list-style: none;
            max-height: calc(100vh - 420px);
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
        }
        .resource-item {
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.1s;
        }
        .resource-item:hover { background: var(--bg-card-hover); }
        .resource-icon { font-size: 0.75rem; }

        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ── JSON View ────────────────────────────────────────────────── */
        .json-view {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .json-view-small { font-size: 0.75rem; padding: 8px; max-height: 200px; overflow-y: auto; }

        .resource-id {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        /* ── Resource Cards ───────────────────────────────────────────── */
        .all-resources {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding: 4px;
        }
        .resource-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .resource-card:hover { border-color: var(--accent-dim); }
        .resource-card-header {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* ── Update Log ───────────────────────────────────────────────── */
        .update-log-card { flex: 1; min-height: 200px; max-height: 50vh; overflow-y: auto; }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header-row h2 { margin-bottom: 0; }

        .update-entries { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }

        .update-entry {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            border-left: 3px solid var(--accent);
        }

        .update-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .update-kind {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .update-channel {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            background: rgba(108,138,255,0.1);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .update-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: auto;
        }
        .update-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        /* ── Changesets ───────────────────────────────────────────────── */
        .changesets { margin-top: 8px; }
        .changeset {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }
        .changeset-header {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .changeset-detail {
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .changeset-detail strong { color: var(--text-muted); }

        /* ── Snapshots ────────────────────────────────────────────────── */
        .updated-snapshots { margin-top: 10px; }
        .updated-snapshots h4 {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .snapshot-entry { margin-bottom: 8px; }
        .snapshot-id {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        /* ── Empty State ──────────────────────────────────────────────── */
        .empty-state {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .error-message {
            margin-top: 8px;
            padding: 8px;
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3);
            border-radius: var(--radius);
            color: var(--error);
            font-size: 0.8rem;
        }

        /* ── Responsive ───────────────────────────────────────────────── */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <div id="elm-root"></div>

    <!-- Elm compiled output -->
    <script src="elm.js"></script>

    <!-- lazy-wasm WASM package -->
    <script type="module">
        import init, { LazyWasmClient } from './pkg/lazy_wasm.js';

        // Wait for WASM to initialise
        const wasmReady = init();

        // Boot Elm
        const app = Elm.Main.init({ node: document.getElementById('elm-root') });

        let client = null;

        // ── Helper: safe port subscription ──────────────────────────────
        function safeSub(portName, handler) {
            if (app.ports[portName]) {
                app.ports[portName].subscribe(handler);
            } else {
                console.warn('[lazy-elm-demo] Port not found:', portName);
            }
        }

        // ── Connect ─────────────────────────────────────────────────────
        safeSub('connect', async function(opts) {
            await wasmReady;
            try {
                client = await LazyWasmClient.connect(opts.serverUrl, opts.channel);

                // Register live-update callback
                client.on_update(function(event) {
                    app.ports.onLiveUpdate.send(event);
                });

                app.ports.onConnectResult.send({
                    success: true,
                    error: null,
                    channel: client.channel()
                });
            } catch (e) {
                app.ports.onConnectResult.send({
                    success: false,
                    error: e.message || String(e),
                    channel: opts.channel
                });
            }
        });

        // ── List Resources ──────────────────────────────────────────────
        safeSub('listResources', async function(_) {
            await wasmReady;
            if (!client) { app.ports.onResourceList.send([]); return; }
            try {
                const ids = client.list_resources();
                app.ports.onResourceList.send(ids);
            } catch (e) {
                console.error('[lazy-elm-demo] listResources error:', e);
                app.ports.onResourceList.send([]);
            }
        });

        // ── Get Resource ────────────────────────────────────────────
        safeSub('getResource', async function(rid) {
            await wasmReady;
            if (!client) return;
            try {
                const value = client.get(rid);
                // Ensure we send a proper object (not null/undefined)
                const safeValue = value != null ? value : {};
                console.log('[lazy-elm-demo] getResource', rid, '→', JSON.stringify(safeValue).substring(0, 200));
                app.ports.onResourceResult.send({ id: rid, value: safeValue });
            } catch (e) {
                console.error('[lazy-elm-demo] getResource error:', e);
                // Send error state so the UI shows something
                app.ports.onResourceResult.send({ id: rid, value: { _error: e.message || String(e) } });
            }
        });

        // ── Get All Resources ───────────────────────────────────────
        safeSub('getAllResources', async function(_) {
            await wasmReady;
            if (!client) { app.ports.onAllResources.send({}); return; }
            try {
                const all = client.get_all();
                const safeAll = all != null ? all : {};
                console.log('[lazy-elm-demo] getAllResources →', Object.keys(safeAll).length, 'resources');
                app.ports.onAllResources.send(safeAll);
            } catch (e) {
                console.error('[lazy-elm-demo] getAllResources error:', e);
                app.ports.onAllResources.send({});
            }
        });

        // ── Stream All Resources ────────────────────────────────────────
        safeSub('streamAllResources', async function(_) {
            await wasmReady;
            if (!client) { app.ports.onStreamComplete.send(null); return; }
            try {
                client.for_each_all(function(id, value) {
                    const safeValue = value != null ? value : {};
                    app.ports.onStreamedResource.send({ id: id, value: safeValue });
                });
                app.ports.onStreamComplete.send(null);
            } catch (e) {
                console.error('[lazy-elm-demo] streamAllResources error:', e);
                app.ports.onStreamComplete.send(null);
            }
        });
    </script>
</body>
</html>
